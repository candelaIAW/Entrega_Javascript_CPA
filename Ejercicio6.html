<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Carrito de la compra</title>
</head>

<body>
    <h1 class="text-center">Carrito de la compra</h1>

    <div class="container">
        <table class="table mx-auto">
            <thead>
                <tr>
                    <th class="text-center">Producto</th>
                    <th class="text-center">Nombre</th>
                    <th class="text-center">Cantidad</th>
                    <th class="text-center">Precio</th>
                    <th class="text-center">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Producto uno</td>
                    <td>
                        <button class="btn btn-outline-dark btn-minus">-</button>
                        <input type="number" class="input-mini text-center cantidad" value="0" min="0">
                        <button class="btn btn-outline-dark btn-plus">+</button>
                    </td>
                    <td><input type="number" class="precio text-center" value="72" readonly> €</td>
                    <td class="text-end subtotal">0 €</td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>Producto dos</td>
                    <td>
                        <button class="btn btn-outline-dark btn-minus">-</button>
                        <input type="number" class="input-mini text-center cantidad" value="0" min="0">
                        <button class="btn btn-outline-dark btn-plus">+</button>
                    </td>
                    <td><input type="number" class="precio text-center" value="125" readonly> €</td>
                    <td class="text-end subtotal">0 €</td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>Producto tres</td>
                    <td>
                        <button class="btn btn-outline-dark btn-minus">-</button>
                        <input type="number" class="input-mini text-center cantidad" value="0" min="0">
                        <button class="btn btn-outline-dark btn-plus">+</button>
                    </td>
                    <td><input type="number" class="precio text-center" value="250" readonly> €</td>
                    <td class="text-end subtotal">0 €</td>
                </tr>
                <tr>
                    <th scope="row">4</th>
                    <td>Producto cuatro</td>
                    <td>
                        <button class="btn btn-outline-dark btn-minus">-</button>
                        <input type="number" class="input-mini text-center cantidad" value="0" min="0">
                        <button class="btn btn-outline-dark btn-plus">+</button>
                    </td>
                    <td><input type="number" class="precio text-center" value="300" readonly> €</td>
                    <td class="text-end subtotal">0 €</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="5" class="text-end">Total = <span id="total">0</span> €</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="text-center mt-3">
        <a href="index.html" class="btn btn-secondary">Volver al Inicio</a>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const actualizarTotales = () => {
                let total = 0;
                document.querySelectorAll("tbody tr").forEach(row => {
                    let cantidad = parseInt(row.querySelector(".cantidad").value);
                    let precio = parseFloat(row.querySelector(".precio").value);
                    let subtotal = cantidad * precio;
                    row.querySelector(".subtotal").textContent = `${subtotal} €`;
                    total += subtotal;
                });
                document.getElementById("total").textContent = total;
            };

            document.querySelectorAll(".btn-plus").forEach(btn => {
                btn.addEventListener("click", function () {
                    let input = this.previousElementSibling;
                    input.value = parseInt(input.value) + 1;
                    actualizarTotales();
                });
            });

            document.querySelectorAll(".btn-minus").forEach(btn => {
                btn.addEventListener("click", function () {
                    let input = this.nextElementSibling;
                    if (parseInt(input.value) > 0) {
                        input.value = parseInt(input.value) - 1;
                        actualizarTotales();
                    }
                });
            });

            document.querySelectorAll(".cantidad").forEach(input => {
                input.addEventListener("input", actualizarTotales);
            });
        });
    </script>

</body>
</html>
