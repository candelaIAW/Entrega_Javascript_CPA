<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Ahorcado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .hidden-word {
            font-size: 24px;
            letter-spacing: 5px;
            margin: 20px 0;
        }
        .letter-input {
            font-size: 20px;
            padding: 5px;
            text-transform: uppercase;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #hangman-img {
            width: 150px;
            height: auto;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Juego del Ahorcado</h1>
    <img id="hangman-img" src="hangman0.png" alt="Ahorcado">
    <p id="message">Cargando palabra...</p>
    <p class="hidden-word" id="hidden-word">_ _ _ _ _</p>
    <input type="text" id="letter-input" class="letter-input" maxlength="1">
    <button id="guess-btn">Adivinar</button>
    <button id="restart-btn">Reiniciar</button>
    <p>Intentos restantes: <span id="attempts">6</span></p>

    <div class="text-center mt-3">
        <a href="index.html" class="btn btn-secondary">Volver al Inicio</a>
    </div>

    <script>
        let word = "";
        let guessedWord = [];
        let attempts = 6;

        async function fetchWord() {
            try {
                let response = await fetch("https://random-word-api.herokuapp.com/word?number=1");
                let data = await response.json();
                word = data[0].toUpperCase();
                guessedWord = Array(word.length).fill("_");
                document.getElementById("hidden-word").textContent = guessedWord.join(" ");
                document.getElementById("message").textContent = "Adivina la palabra";
                document.getElementById("hangman-img").src = `hangman0.png`;
            } catch (error) {
                document.getElementById("message").textContent = "Error al cargar la palabra.";
            }
        }

        fetchWord();

        document.getElementById("guess-btn").addEventListener("click", function() {
            let input = document.getElementById("letter-input");
            let letter = input.value.toUpperCase();
            input.value = "";

            if (!letter.match(/[A-Z]/) || letter.length !== 1) {
                alert("Ingresa una letra válida.");
                return;
            }

            if (word.includes(letter)) {
                for (let i = 0; i < word.length; i++) {
                    if (word[i] === letter) {
                        guessedWord[i] = letter;
                    }
                }
            } else {
                attempts--;
                document.getElementById("hangman-img").src = `hangman${6 - attempts}.png`;
            }

            document.getElementById("hidden-word").textContent = guessedWord.join(" ");
            document.getElementById("attempts").textContent = attempts;

            if (!guessedWord.includes("_")) {
                document.getElementById("message").textContent = "¡Ganaste! La palabra era " + word;
                document.getElementById("guess-btn").disabled = true;
            } else if (attempts === 0) {
                document.getElementById("message").textContent = "Perdiste. La palabra era " + word;
                document.getElementById("guess-btn").disabled = true;
            }
        });

        document.getElementById("restart-btn").addEventListener("click", function() {
            attempts = 6;
            document.getElementById("attempts").textContent = attempts;
            document.getElementById("guess-btn").disabled = false;
            fetchWord();
        });
    </script>

</body>
</html>
