<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Dados</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .dice {
            width: 100px;
        }
    </style>
</head>
<body>

    <h1>Juego de Dados</h1>
    <button onclick="lanzarDados()">Lanzar Dados</button>
    
    <div class="dice-container">
        <img id="dado1" class="dice" src="dado1.png" alt="Dado 1">
        <img id="dado2" class="dice" src="dado2.png" alt="Dado 2">
    </div>
    
    <h2 id="resultado">Suma: ?</h2>

    <div class="text-center mt-3">
        <a href="index.html" class="btn btn-secondary">Volver al Inicio</a>
    </div>
    
    <script>
        function lanzarDados() {
            let dado1 = Math.floor(Math.random() * 6) + 1;
            let dado2 = Math.floor(Math.random() * 6) + 1;
            let suma = dado1 + dado2;

            document.getElementById("dado1").src = `dado${dado1}.png`;
            document.getElementById("dado2").src = `dado${dado2}.png`;
            document.getElementById("resultado").textContent = `Suma: ${suma}`;
        }
    </script>

</body>
</html>
